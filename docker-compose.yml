services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: stigmergy
      POSTGRES_PASSWORD: stigmergy
      POSTGRES_DB: stigmergy
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stigmergy -d stigmergy && psql -U stigmergy -d stigmergy_test -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    # MinIO no longer publishes pullable community images; this is the frozen Bitnami build.
    image: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    user: "0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/stigmergy-evidence && exec minio server /data --console-address ':9001'"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
