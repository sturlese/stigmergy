<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The knowledge model: notes, concepts, entity identities, and immutable sources, plus the rule that visibility is a write constraint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#161F3D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FB7185"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ADE80"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .k { font-size: 11px; font-weight: 700; fill: #F6B73C; letter-spacing: 2px; }
      .h { font-size: 16px; font-weight: 700; fill: #EEF2FF; }
      .s { font-size: 11.5px; font-weight: 500; fill: #9AA6C4; }
      .p { font-size: 11.5px; font-weight: 600; }
      .chip { font-size: 10px; font-weight: 600; }
      .card { fill: #FFFFFF; fill-opacity: 0.04; stroke: #FFFFFF; stroke-opacity: 0.10; }
    </style>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="28" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="40" y="46" class="sans k">FOUR PAGE ROLES · ONE VISIBILITY RULE</text>

  <!-- Note -->
  <g class="sans">
    <rect x="40" y="70" width="335" height="170" rx="14" class="card"/>
    <rect x="52" y="86" width="4" height="138" rx="2" fill="#A78BFA"/>
    <text x="70" y="106" class="h">Note</text>
    <text x="70" y="128" class="mono p" fill="#C4B5FD">wiki/notes/&lt;Title&gt;.md</text>
    <text x="70" y="154" class="s">Contextual conclusions, decisions and events</text>
    <text x="70" y="172" class="s">worth retrieving later. Rewritten freely.</text>
    <g class="mono chip" fill="#C7D0E6">
      <rect x="70" y="198" width="40" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="90" y="213" text-anchor="middle">seed</text>
      <rect x="116" y="198" width="76" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="154" y="213" text-anchor="middle">developing</text>
      <rect x="198" y="198" width="54" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="225" y="213" text-anchor="middle">mature</text>
      <rect x="258" y="198" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="292" y="213" text-anchor="middle">evergreen</text>
    </g>
  </g>

  <!-- Concept -->
  <g class="sans">
    <rect x="395" y="70" width="335" height="170" rx="14" class="card"/>
    <rect x="407" y="86" width="4" height="138" rx="2" fill="#A78BFA"/>
    <text x="425" y="106" class="h">Concept</text>
    <text x="425" y="128" class="mono p" fill="#C4B5FD">wiki/concepts/&lt;Title&gt;.md</text>
    <text x="425" y="154" class="s">Durable explanatory knowledge that outlives</text>
    <text x="425" y="172" class="s">any single event or decision.</text>
    <g class="mono chip" fill="#C7D0E6">
      <rect x="425" y="198" width="40" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="445" y="213" text-anchor="middle">seed</text>
      <rect x="471" y="198" width="76" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="509" y="213" text-anchor="middle">developing</text>
      <rect x="553" y="198" width="54" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="580" y="213" text-anchor="middle">mature</text>
      <rect x="613" y="198" width="68" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="647" y="213" text-anchor="middle">evergreen</text>
    </g>
  </g>

  <!-- Entity -->
  <g class="sans">
    <rect x="40" y="260" width="335" height="170" rx="14" class="card"/>
    <rect x="52" y="276" width="4" height="138" rx="2" fill="#60A5FA"/>
    <text x="70" y="296" class="h">Entity identity</text>
    <text x="70" y="318" class="mono p" fill="#93C5FD">wiki/entities/ent_&lt;uuid&gt;.md</text>
    <text x="70" y="344" class="s">Opaque immutable ID and scoped, sourced</text>
    <text x="70" y="362" class="s">name claims. Never a dossier: facts live in</text>
    <text x="70" y="380" class="s">notes and concepts, composed at read time.</text>
    <g class="mono chip" fill="#93C5FD">
      <rect x="70" y="396" width="94" height="22" rx="11" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.4"/>
      <text x="117" y="411" text-anchor="middle">identity only</text>
      <rect x="170" y="396" width="100" height="22" rx="11" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.4"/>
      <text x="220" y="411" text-anchor="middle">not searchable</text>
      <rect x="276" y="396" width="78" height="22" rx="11" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.4"/>
      <text x="315" y="411" text-anchor="middle">no dossier</text>
    </g>
  </g>

  <!-- Source -->
  <g class="sans">
    <rect x="395" y="260" width="335" height="170" rx="14" class="card"/>
    <rect x="407" y="276" width="4" height="138" rx="2" fill="#2DD4BF"/>
    <text x="425" y="296" class="h">Source</text>
    <text x="425" y="318" class="mono p" fill="#5EEAD4">sources/YYYY/MM/&lt;capture-id&gt;.md</text>
    <text x="425" y="344" class="s">Immutable readable evidence for exactly one</text>
    <text x="425" y="362" class="s">capture: provenance, hashes, full extraction.</text>
    <text x="425" y="380" class="s">Cited by every page it supports.</text>
    <g class="mono chip" fill="#5EEAD4">
      <rect x="425" y="396" width="86" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.4"/>
      <text x="468" y="411" text-anchor="middle">append-only</text>
      <rect x="517" y="396" width="104" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.4"/>
      <text x="569" y="411" text-anchor="middle">one per capture</text>
      <rect x="627" y="396" width="84" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.4"/>
      <text x="669" y="411" text-anchor="middle">exact bytes</text>
    </g>
  </g>

  <!-- Visibility panel -->
  <g class="sans">
    <rect x="770" y="70" width="390" height="360" rx="14" class="card"/>
    <rect x="782" y="86" width="4" height="328" rx="2" fill="#FB7185"/>
    <text x="800" y="106" class="h">Visibility is a write constraint</text>
    <text x="800" y="126" class="s">a page may only use evidence all its readers may see</text>

    <rect x="800" y="150" width="332" height="30" rx="8" fill="#60A5FA" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.6"/>
    <text x="816" y="170" class="p" fill="#BFDBFE">organization-wide page</text>
    <text x="1118" y="170" text-anchor="end" class="mono chip" fill="#93C5FD">acl: null</text>

    <rect x="800" y="218" width="176" height="30" rx="8" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.7"/>
    <text x="816" y="238" class="p" fill="#FECDD3">restricted capture</text>
    <text x="966" y="238" text-anchor="end" class="mono chip" fill="#FDA4AF">sales</text>

    <line x1="888" y1="216" x2="888" y2="184" stroke="#FB7185" stroke-width="1.8" marker-end="url(#arrowRose)"/>
    <circle cx="888" cy="199" r="9" fill="#0E1530" stroke="#FB7185" stroke-width="1.5"/>
    <line x1="884" y1="195" x2="892" y2="203" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="892" y1="195" x2="884" y2="203" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round"/>
    <text x="906" y="203" class="p" font-size="11" fill="#FB7185">never broadens the open page</text>

    <rect x="800" y="286" width="176" height="30" rx="8" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="816" y="306" class="p" fill="#DDD6FE">companion page</text>
    <text x="966" y="306" text-anchor="end" class="mono chip" fill="#C4B5FD">sales</text>

    <line x1="888" y1="250" x2="888" y2="282" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <circle cx="888" cy="266" r="9" fill="#0E1530" stroke="#4ADE80" stroke-width="1.5"/>
    <path d="M883.5 266 l3.5 3.5 l6 -7" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="906" y="270" class="p" font-size="11" fill="#4ADE80">creates or updates a restricted page</text>

    <text x="800" y="352" class="s">Every reader of a page must be allowed to read</text>
    <text x="800" y="370" class="s">the evidence behind it, on writes as well as reads.</text>
    <text x="800" y="396" class="s">Unknown, hidden and unauthorized paths, entities</text>
    <text x="800" y="414" class="s">and captures look identical from the outside.</text>
  </g>
</svg>
