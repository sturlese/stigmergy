<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="The knowledge model: notes, concepts, entity identities, immutable sources, and the rule that visibility is a write constraint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#161F3D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FB7185"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ADE80"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .k { font-size: 11px; font-weight: 700; fill: #F6B73C; letter-spacing: 2px; }
      .h { font-size: 17px; font-weight: 700; fill: #EEF2FF; }
      .s { font-size: 12px; font-weight: 500; fill: #9AA6C4; }
      .p { font-size: 12px; font-weight: 600; }
      .chip { font-size: 10.5px; font-weight: 600; }
      .card { fill: #FFFFFF; fill-opacity: 0.04; stroke: #FFFFFF; stroke-opacity: 0.10; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="40" y="46" class="sans k">FOUR PAGE ROLES · ONE VISIBILITY RULE</text>

  <g class="sans">
    <rect x="40" y="70" width="335" height="130" rx="14" class="card"/>
    <rect x="52" y="86" width="4" height="98" rx="2" fill="#A78BFA"/>
    <text x="70" y="108" class="h">Note</text>
    <text x="70" y="132" class="mono p" fill="#C4B5FD">wiki/notes/</text>
    <text x="70" y="160" class="s">conclusions, decisions, events</text>

    <rect x="395" y="70" width="335" height="130" rx="14" class="card"/>
    <rect x="407" y="86" width="4" height="98" rx="2" fill="#A78BFA"/>
    <text x="425" y="108" class="h">Concept</text>
    <text x="425" y="132" class="mono p" fill="#C4B5FD">wiki/concepts/</text>
    <text x="425" y="160" class="s">durable explanatory knowledge</text>

    <rect x="40" y="220" width="335" height="130" rx="14" class="card"/>
    <rect x="52" y="236" width="4" height="98" rx="2" fill="#60A5FA"/>
    <text x="70" y="258" class="h">Entity identity</text>
    <text x="70" y="282" class="mono p" fill="#93C5FD">wiki/entities/ent_&lt;uuid&gt;.md</text>
    <text x="70" y="310" class="s">identity only, never a dossier</text>

    <rect x="395" y="220" width="335" height="130" rx="14" class="card"/>
    <rect x="407" y="236" width="4" height="98" rx="2" fill="#2DD4BF"/>
    <text x="425" y="258" class="h">Source</text>
    <text x="425" y="282" class="mono p" fill="#5EEAD4">sources/YYYY/MM/&lt;id&gt;.md</text>
    <text x="425" y="310" class="s">immutable evidence, one per capture</text>
  </g>

  <g class="sans">
    <rect x="770" y="70" width="390" height="280" rx="14" class="card"/>
    <rect x="782" y="86" width="4" height="248" rx="2" fill="#FB7185"/>
    <text x="800" y="108" class="h">Visibility is a write constraint</text>

    <rect x="800" y="140" width="332" height="30" rx="8" fill="#60A5FA" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.6"/>
    <text x="816" y="160" class="p" fill="#BFDBFE">organization-wide page</text>

    <rect x="800" y="208" width="176" height="30" rx="8" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.7"/>
    <text x="816" y="228" class="p" fill="#FECDD3">restricted capture</text>

    <line x1="888" y1="206" x2="888" y2="174" stroke="#FB7185" stroke-width="1.8" marker-end="url(#arrowRose)"/>
    <circle cx="888" cy="189" r="9" fill="#0E1530" stroke="#FB7185" stroke-width="1.5"/>
    <line x1="884" y1="185" x2="892" y2="193" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="892" y1="185" x2="884" y2="193" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round"/>
    <text x="906" y="193" class="p" fill="#FB7185">never broadens</text>

    <rect x="800" y="276" width="176" height="30" rx="8" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="816" y="296" class="p" fill="#DDD6FE">companion page</text>

    <line x1="888" y1="240" x2="888" y2="272" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <circle cx="888" cy="256" r="9" fill="#0E1530" stroke="#4ADE80" stroke-width="1.5"/>
    <path d="M883.5 256 l3.5 3.5 l6 -7" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="906" y="260" class="p" fill="#4ADE80">restricted companion instead</text>
  </g>
</svg>
