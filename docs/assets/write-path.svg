<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 566" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#bb8009"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#8957e5" flood-opacity="0.55"/>
    </filter>
    <filter id="glowT" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3fb950" flood-opacity="0.40"/>
    </filter>
    <style>
      .node   { fill:#161b22; stroke:#30363d; stroke-width:1.2; }
      .band   { fill:#11161d; stroke:#30363d; stroke-width:1.2; }
      .chip   { fill:#161b22; stroke:#3d444d; stroke-width:1.1; }
      .agent  { fill:#1c1332; stroke:#8957e5; stroke-width:1.4; }
      .human  { fill:#201a02; stroke:#bb8009; stroke-width:1.3; }
      .truth  { fill:#0c1f14; stroke:#3fb950; stroke-width:1.8; }
      .title  { fill:#e6edf3; font-size:15px; font-weight:600; text-anchor:middle; }
      .chipT  { fill:#c9d1d9; font-size:11.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .chipN  { fill:#6e7681; font-size:9.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tag    { fill:#8b949e; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagA   { fill:#c9b3f5; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagH   { fill:#e3b341; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagT   { fill:#7ee787; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .edge   { stroke:#8b949e; stroke-width:1.5; fill:none; }
      .edgeH  { stroke:#bb8009; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
      .edgeT  { stroke:#3fb950; stroke-width:1.6; fill:none; }
      .elab   { fill:#8b949e; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .elabH  { fill:#e3b341; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .elabT  { fill:#7ee787; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .sect   { fill:#6e7681; font-size:11px; font-weight:600; letter-spacing:2.5px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1058" height="564" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="26" y="46" class="sect">THE WRITE PATH</text>

  <!-- ── the spine ─────────────────────────────────────────────────────────── -->
  <rect class="human" x="24" y="74" width="156" height="62" rx="10"/>
  <text x="102" y="100" class="title">material</text>
  <text x="102" y="120" class="tagH">thread · transcript</text>

  <rect class="node" x="212" y="74" width="156" height="62" rx="10"/>
  <text x="290" y="100" class="title">capture queue</text>
  <text x="290" y="120" class="tag">the server attributes it</text>
  <line class="edge" x1="180" y1="105" x2="208" y2="105" marker-end="url(#arr)"/>

  <rect class="agent" x="400" y="62" width="208" height="86" rx="10" filter="url(#glow)"/>
  <text x="504" y="90" class="title">the agent drafts</text>
  <text x="504" y="110" class="tagA">a throwaway worktree</text>
  <text x="504" y="128" class="tagA">bounded turns · tools · time</text>
  <line class="edge" x1="368" y1="105" x2="396" y2="105" marker-end="url(#arr)"/>

  <!-- ── the human loop ────────────────────────────────────────────────────── -->
  <rect class="agent" x="644" y="62" width="176" height="86" rx="10" filter="url(#glow)"/>
  <text x="732" y="90" class="title">proposes</text>
  <text x="732" y="110" class="tagA">a name the registry</text>
  <text x="732" y="128" class="tagA">does not know</text>
  <line class="edge" x1="608" y1="105" x2="640" y2="105" marker-end="url(#arr)"/>

  <rect class="human" x="856" y="62" width="180" height="86" rx="10"/>
  <text x="946" y="90" class="title">inbox</text>
  <text x="946" y="110" class="tagH">a steward approves,</text>
  <text x="946" y="128" class="tagH">merges or declines</text>
  <line class="edgeH" x1="820" y1="105" x2="852" y2="105" marker-end="url(#arrh)"/>

  <!-- the decision is one governed commit; the capture itself never waited -->
  <path class="edgeH" d="M 946 62 L 946 40 L 290 40 L 290 70" marker-end="url(#arrh)"/>
  <text x="618" y="34" class="elabH" text-anchor="middle">the capture files at once; the proposal waits, and the decision is one governed commit</text>

  <!-- ── the gates ─────────────────────────────────────────────────────────── -->
  <line class="edge" x1="504" y1="148" x2="504" y2="256" marker-end="url(#arr)"/>
  <text x="492" y="205" class="elab" text-anchor="end">a diff,</text>
  <text x="492" y="219" class="elab" text-anchor="end">not a decision</text>

  <rect class="band" x="24" y="262" width="1012" height="120" rx="14"/>
  <text x="530" y="292" class="title" font-size="14">9 deterministic gates over that diff — a model can be argued with, a gate cannot</text>

  <rect class="chip" x="36" y="308" width="102" height="52" rx="9"/>
  <text x="87" y="332" class="chipT">zone</text>
  <text x="87" y="348" class="chipN">where it writes</text>

  <rect class="chip" x="147" y="308" width="102" height="52" rx="9"/>
  <text x="198" y="332" class="chipT">binary-page</text>
  <text x="198" y="348" class="chipN">no blob pages</text>

  <rect class="chip" x="258" y="308" width="102" height="52" rx="9"/>
  <text x="309" y="332" class="chipT">body-rewrite</text>
  <text x="309" y="348" class="chipN">no silent edits</text>

  <rect class="chip" x="369" y="308" width="102" height="52" rx="9"/>
  <text x="420" y="332" class="chipT">secrets</text>
  <text x="420" y="348" class="chipN">real gitleaks</text>

  <rect class="chip" x="480" y="308" width="102" height="52" rx="9"/>
  <text x="531" y="332" class="chipT">pii</text>
  <text x="531" y="348" class="chipN">flagged, kept</text>

  <rect class="chip" x="591" y="308" width="102" height="52" rx="9"/>
  <text x="642" y="332" class="chipT">frontmatter</text>
  <text x="642" y="348" class="chipN">page contract</text>

  <rect class="chip" x="702" y="308" width="102" height="52" rx="9"/>
  <text x="753" y="332" class="chipT">contract</text>
  <text x="753" y="348" class="chipN">the repo's linter</text>

  <rect class="chip" x="813" y="308" width="102" height="52" rx="9"/>
  <text x="864" y="332" class="chipT">anchoring</text>
  <text x="864" y="348" class="chipN">points at something</text>

  <rect class="chip" x="924" y="308" width="102" height="52" rx="9"/>
  <text x="975" y="332" class="chipT">identity</text>
  <text x="975" y="348" class="chipN">declared proposals</text>

  <!-- ── outcomes ──────────────────────────────────────────────────────────── -->
  <line class="edge" x1="250" y1="382" x2="250" y2="424" marker-end="url(#arr)"/>
  <text x="238" y="406" class="elab" text-anchor="end">any fails</text>
  <rect class="node" x="140" y="428" width="220" height="66" rx="10"/>
  <text x="250" y="454" class="title" font-size="14">bounced back</text>
  <text x="250" y="474" class="tag">with the reason, to a human</text>

  <line class="edgeT" x1="770" y1="382" x2="770" y2="424" marker-end="url(#arrg)"/>
  <text x="782" y="406" class="elabT">all pass</text>
  <rect class="truth" x="660" y="428" width="220" height="66" rx="10" filter="url(#glowT)"/>
  <text x="770" y="454" class="title" font-size="14">committed</text>
  <text x="770" y="474" class="tagT">to the knowledge repo</text>

  <text x="530" y="518" class="elabT" text-anchor="middle">the diff the gates approved is provably the diff that lands — gitcmd.commit(gated_entries=…)</text>

  <!-- ── legend ───────────────────────────────────────────────────────────── -->
  <g transform="translate(26,546)">
    <rect x="0" y="-9" width="12" height="12" rx="3" fill="#1c1332" stroke="#8957e5" stroke-width="1.2"/>
    <text x="20" y="1" class="elab">a model — drafts, never decides</text>
    <rect x="250" y="-9" width="12" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="270" y="1" class="elab">code — decides</text>
    <rect x="410" y="-9" width="12" height="12" rx="6" fill="#201a02" stroke="#bb8009" stroke-width="1.2"/>
    <text x="430" y="1" class="elab">a human</text>
    <rect x="530" y="-9" width="12" height="12" rx="3" fill="#0c1f14" stroke="#3fb950" stroke-width="1.4"/>
    <text x="550" y="1" class="elab">git — the substrate</text>
  </g>
</svg>
