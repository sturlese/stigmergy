<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The write path: acquire, upload, queue, process, landed; a failure becomes a safe error with bounded retries">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#161F3D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FB7185"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .k { font-size: 11px; font-weight: 700; fill: #F6B73C; letter-spacing: 2px; }
      .h { font-size: 16px; font-weight: 700; fill: #EEF2FF; }
      .s { font-size: 12px; font-weight: 500; fill: #9AA6C4; }
      .num { font-size: 14px; font-weight: 800; }
      .chip { font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="40" y="46" class="sans k">ONE FLOW FOR EVERY CAPTURE</text>

  <line x1="130" y1="120" x2="1070" y2="120" stroke="#F6B73C" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.9"/>

  <g class="mono chip">
    <rect x="538" y="64" width="64" height="22" rx="11" fill="#8B95B0" fill-opacity="0.12" stroke="#8B95B0" stroke-opacity="0.5"/>
    <text x="570" y="79" text-anchor="middle" fill="#C7D0E6">queued</text>
    <line x1="570" y1="86" x2="570" y2="96" stroke="#8B95B0" stroke-opacity="0.5"/>
    <rect x="746" y="64" width="88" height="22" rx="11" fill="#F6B73C" fill-opacity="0.12" stroke="#F6B73C" stroke-opacity="0.6"/>
    <text x="790" y="79" text-anchor="middle" fill="#F6B73C">processing</text>
    <line x1="790" y1="86" x2="790" y2="96" stroke="#F6B73C" stroke-opacity="0.5"/>
    <rect x="1038" y="64" width="64" height="22" rx="11" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6"/>
    <text x="1070" y="79" text-anchor="middle" fill="#4ADE80">landed</text>
    <line x1="1070" y1="86" x2="1070" y2="96" stroke="#4ADE80" stroke-opacity="0.5"/>
  </g>

  <g class="sans num">
    <circle cx="130" cy="120" r="22" fill="#0E1530" stroke="#F6B73C" stroke-width="3"/>
    <text x="130" y="125" text-anchor="middle" fill="#F6B73C">1</text>
    <circle cx="350" cy="120" r="22" fill="#0E1530" stroke="#F6B73C" stroke-width="3"/>
    <text x="350" y="125" text-anchor="middle" fill="#F6B73C">2</text>
    <circle cx="570" cy="120" r="22" fill="#0E1530" stroke="#F6B73C" stroke-width="3"/>
    <text x="570" y="125" text-anchor="middle" fill="#F6B73C">3</text>
    <circle cx="790" cy="120" r="22" fill="#0E1530" stroke="#F6B73C" stroke-width="3"/>
    <text x="790" y="125" text-anchor="middle" fill="#F6B73C">4</text>
    <g filter="url(#glow)">
      <circle cx="1070" cy="120" r="22" fill="#0E1530" stroke="#4ADE80" stroke-width="3"/>
    </g>
    <text x="1070" y="125" text-anchor="middle" fill="#4ADE80">5</text>
  </g>

  <g class="sans" text-anchor="middle">
    <text x="130" y="172" class="h">Acquire</text>
    <text x="130" y="194" class="s">bytes + SHA-256</text>
    <text x="350" y="172" class="h">Upload</text>
    <text x="350" y="194" class="s">presigned, verified</text>
    <text x="570" y="172" class="h">Queue</text>
    <text x="570" y="194" class="s">idempotent, no copies</text>
    <text x="790" y="172" class="h">Process</text>
    <text x="790" y="194" class="s">extract · file · gates</text>
    <text x="1070" y="172" class="h" fill="#4ADE80">Landed</text>
    <text x="1070" y="194" class="s">one commit, indexed</text>
  </g>

  <path d="M812 126 C 905 135, 930 185, 940 226" fill="none" stroke="#FB7185" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowRose)"/>
  <rect x="896" y="230" width="108" height="28" rx="14" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.7"/>
  <text x="950" y="248" text-anchor="middle" class="mono chip" fill="#FB7185">failed</text>
  <text x="950" y="280" text-anchor="middle" class="sans s">safe error · bounded retries</text>
</svg>
