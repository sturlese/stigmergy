<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Stigmergy architecture: three capture adapters, one envelope and queue, one serialized writer, a Git knowledge repository, and ACL-scoped reads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#161F3D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA6C4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F6B73C"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .k { font-size: 11px; font-weight: 700; fill: #F6B73C; letter-spacing: 2px; }
      .h { font-size: 16px; font-weight: 700; fill: #EEF2FF; }
      .s { font-size: 12px; font-weight: 500; fill: #9AA6C4; }
      .m { font-size: 12px; font-weight: 500; fill: #C7D0E6; }
      .n { font-size: 11px; font-weight: 700; }
      .lbl { font-size: 10.5px; font-weight: 600; fill: #8B95B0; }
      .card { fill: #FFFFFF; fill-opacity: 0.04; stroke: #FFFFFF; stroke-opacity: 0.10; }
    </style>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="600" rx="28" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g class="sans k">
    <text x="40" y="52">01 · CAPTURE</text>
    <text x="350" y="52">02 · QUEUE</text>
    <text x="600" y="52">03 · WRITE</text>
    <text x="900" y="52">04 · REMEMBER</text>
  </g>

  <!-- 01 adapters -->
  <g class="sans">
    <rect x="40" y="76" width="250" height="84" rx="14" class="card"/>
    <rect x="52" y="92" width="4" height="52" rx="2" fill="#60A5FA"/>
    <text x="68" y="110" class="h">Local MCP bridge</text>
    <text x="68" y="134" class="s">Claude Code · Codex</text>

    <rect x="40" y="176" width="250" height="84" rx="14" class="card"/>
    <rect x="52" y="192" width="4" height="52" rx="2" fill="#60A5FA"/>
    <text x="68" y="210" class="h">Slack</text>
    <text x="68" y="234" class="s">:brain: reaction on a thread</text>

    <rect x="40" y="276" width="250" height="84" rx="14" class="card"/>
    <rect x="52" y="292" width="4" height="52" rx="2" fill="#60A5FA"/>
    <text x="68" y="310" class="h">Backoffice</text>
    <text x="68" y="334" class="s">paste · upload · URL</text>
  </g>

  <g fill="none" stroke="#F6B73C" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6">
    <path d="M290 118 C 312 118, 302 165, 322 165"/>
    <path d="M290 218 C 312 218, 302 165, 322 165"/>
    <path d="M290 318 C 312 318, 302 165, 322 165"/>
  </g>
  <circle cx="322" cy="165" r="4" fill="#F6B73C" filter="url(#glow)"/>
  <line x1="327" y1="165" x2="347" y2="165" stroke="#F6B73C" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- 02 envelope + queue -->
  <g class="sans">
    <rect x="350" y="120" width="220" height="90" rx="14" class="card"/>
    <rect x="362" y="136" width="4" height="58" rx="2" fill="#F6B73C"/>
    <text x="378" y="154" class="mono" font-size="15" font-weight="700" fill="#F6B73C">CaptureEnvelope</text>
    <text x="378" y="180" class="s">actor · audience · artifact refs</text>

    <rect x="350" y="250" width="220" height="90" rx="14" class="card"/>
    <rect x="362" y="266" width="4" height="58" rx="2" fill="#F6B73C"/>
    <text x="378" y="284" class="h">Durable queue</text>
    <text x="378" y="312" class="mono" font-size="11" font-weight="600">
      <tspan fill="#8B95B0">queued</tspan><tspan fill="#5B6684">&#160;→&#160;</tspan><tspan fill="#F6B73C">processing</tspan><tspan fill="#5B6684">&#160;→&#160;</tspan><tspan fill="#4ADE80">landed</tspan>
    </text>
  </g>

  <line x1="460" y1="214" x2="460" y2="244" stroke="#9AA6C4" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="573" y1="295" x2="594" y2="295" stroke="#9AA6C4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 03 writer -->
  <g class="sans">
    <rect x="600" y="76" width="270" height="300" rx="14" class="card"/>
    <rect x="612" y="92" width="4" height="268" rx="2" fill="#F6B73C"/>
    <text x="628" y="110" class="h">One serialized writer</text>
    <text x="628" y="132" class="s">every Git write, one process</text>

    <g class="n">
      <circle cx="640" cy="170" r="11" fill="#F6B73C" fill-opacity="0.15" stroke="#F6B73C" stroke-width="1.5"/>
      <text x="640" y="174" text-anchor="middle" fill="#F6B73C">1</text>
      <circle cx="640" cy="204" r="11" fill="#F6B73C" fill-opacity="0.15" stroke="#F6B73C" stroke-width="1.5"/>
      <text x="640" y="208" text-anchor="middle" fill="#F6B73C">2</text>
      <circle cx="640" cy="238" r="11" fill="#F6B73C" fill-opacity="0.15" stroke="#F6B73C" stroke-width="1.5"/>
      <text x="640" y="242" text-anchor="middle" fill="#F6B73C">3</text>
      <circle cx="640" cy="272" r="11" fill="#F6B73C" fill-opacity="0.15" stroke="#F6B73C" stroke-width="1.5"/>
      <text x="640" y="276" text-anchor="middle" fill="#F6B73C">4</text>
      <circle cx="640" cy="306" r="11" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="1.5"/>
      <text x="640" y="310" text-anchor="middle" fill="#4ADE80">5</text>
    </g>
    <g class="m" font-size="12.5">
      <text x="660" y="174">Extract</text>
      <text x="660" y="208">Render the source page</text>
      <text x="660" y="242">Librarian filing plan</text>
      <text x="660" y="276">Gates</text>
      <text x="660" y="310" fill="#4ADE80">One commit</text>
    </g>

    <rect x="616" y="332" width="158" height="26" rx="13" fill="#F6B73C" fill-opacity="0.08" stroke="#F6B73C" stroke-opacity="0.4"/>
    <text x="695" y="349" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#F6B73C">gardener · same gates</text>
  </g>

  <line x1="873" y1="226" x2="894" y2="226" stroke="#9AA6C4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 04 repository -->
  <g class="sans">
    <rect x="900" y="76" width="260" height="300" rx="14" class="card"/>
    <rect x="912" y="92" width="4" height="268" rx="2" fill="#A78BFA"/>
    <text x="928" y="110" class="h">Knowledge repository</text>
    <text x="928" y="132" class="s">Git + Markdown</text>

    <circle cx="934" cy="170" r="4" fill="#2DD4BF"/>
    <text x="946" y="174" class="mono m" fill="#5EEAD4">sources/YYYY/MM/&lt;id&gt;.md</text>
    <circle cx="934" cy="204" r="4" fill="#A78BFA"/>
    <text x="946" y="208" class="mono m" fill="#C4B5FD">wiki/notes/</text>
    <circle cx="934" cy="238" r="4" fill="#A78BFA"/>
    <text x="946" y="242" class="mono m" fill="#C4B5FD">wiki/concepts/</text>
    <circle cx="934" cy="272" r="4" fill="#60A5FA"/>
    <text x="946" y="276" class="mono m" fill="#93C5FD">wiki/entities/</text>
    <circle cx="934" cy="306" r="4" fill="#6B7694"/>
    <text x="946" y="310" class="mono m" fill="#9AA6C4">ops/</text>

    <text x="928" y="352" class="s" fill="#F6B73C">one operation = one commit</text>
  </g>

  <!-- bottom row -->
  <line x1="460" y1="344" x2="460" y2="404" stroke="#9AA6C4" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="470" y="378" class="sans lbl">bytes</text>
  <line x1="735" y1="380" x2="735" y2="404" stroke="#9AA6C4" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1030" y1="380" x2="1030" y2="404" stroke="#9AA6C4" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1040" y="396" class="sans lbl">webhook · nightly</text>

  <g class="sans">
    <rect x="350" y="410" width="520" height="80" rx="14" class="card"/>
    <rect x="362" y="426" width="4" height="48" rx="2" fill="#2DD4BF"/>
    <text x="378" y="444" class="h">Private evidence store</text>
    <text x="378" y="468" class="mono m" fill="#5EEAD4">exact bytes · content-addressed · never public</text>

    <rect x="900" y="410" width="260" height="80" rx="14" class="card"/>
    <rect x="912" y="426" width="4" height="48" rx="2" fill="#60A5FA"/>
    <text x="928" y="444" class="h">Search index</text>
    <text x="928" y="468" class="s">full-text + pgvector</text>
  </g>

  <line x1="1030" y1="494" x2="1030" y2="516" stroke="#9AA6C4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 05 read -->
  <g class="sans">
    <rect x="40" y="520" width="1120" height="40" rx="20" fill="#60A5FA" fill-opacity="0.08" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="64" y="545" class="k" fill="#93C5FD">05 · READ</text>
    <text x="150" y="545" class="mono m" fill="#DCE3F5">search_brain · read_page · ask · list_entities · describe_entity</text>
    <text x="1136" y="545" text-anchor="end" class="s">scoped to the caller's ACL</text>
  </g>
</svg>
