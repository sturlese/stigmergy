<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 528" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#8957e5" flood-opacity="0.55"/>
    </filter>
    <filter id="glowT" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3fb950" flood-opacity="0.40"/>
    </filter>
    <style>
      .node   { fill:#161b22; stroke:#30363d; stroke-width:1.2; }
      .agent  { fill:#1c1332; stroke:#8957e5; stroke-width:1.4; }
      .store  { fill:#0d1117; stroke:#484f58; stroke-width:1.2; stroke-dasharray:5 4; }
      .human  { fill:#201a02; stroke:#bb8009; stroke-width:1.3; }
      .truth  { fill:#0c1f14; stroke:#3fb950; stroke-width:1.8; }
      .title  { fill:#e6edf3; font-size:15px; font-weight:600; text-anchor:middle; }
      .titleM { fill:#e6edf3; font-size:14px; font-weight:600; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tag    { fill:#8b949e; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagA   { fill:#c9b3f5; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagH   { fill:#e3b341; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagT   { fill:#7ee787; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .edge   { stroke:#8b949e; stroke-width:1.5; fill:none; }
      .edgeT  { stroke:#3fb950; stroke-width:1.6; fill:none; }
      .elab   { fill:#8b949e; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .elabT  { fill:#7ee787; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .sect   { fill:#6e7681; font-size:11px; font-weight:600; letter-spacing:2.5px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1058" height="526" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="26" y="46" class="sect">CAPTURE · MANY DOORS</text>
  <text x="820" y="46" class="sect">SERVING · ONE API</text>

  <!-- ── the doors ─────────────────────────────────────────────────────────── -->
  <rect class="human" x="24" y="82" width="132" height="52" rx="10"/>
  <text x="90" y="104" class="title">Slack</text>
  <text x="90" y="121" class="tagH">🧠 react · @mention</text>

  <rect class="human" x="24" y="150" width="132" height="52" rx="10"/>
  <text x="90" y="172" class="title">operator CLIs</text>
  <text x="90" y="189" class="tagH">meeting · Drive</text>

  <rect class="human" x="24" y="218" width="132" height="52" rx="10"/>
  <text x="90" y="240" class="title">MCP client</text>
  <text x="90" y="257" class="tagH">brain_submit</text>

  <!-- ── the durable queue ─────────────────────────────────────────────────── -->
  <rect class="node" x="204" y="120" width="140" height="80" rx="10"/>
  <text x="274" y="148" class="title">capture queue</text>
  <text x="274" y="166" class="tag">durable · leased</text>
  <text x="274" y="182" class="tag">server-attributed</text>

  <line class="edge" x1="156" y1="108" x2="200" y2="142" marker-end="url(#arr)"/>
  <line class="edge" x1="156" y1="176" x2="200" y2="162" marker-end="url(#arr)"/>
  <line class="edge" x1="156" y1="244" x2="200" y2="182" marker-end="url(#arr)"/>

  <rect class="store" x="204" y="228" width="140" height="50" rx="14"/>
  <text x="274" y="250" class="titleM" font-size="12.5">evidence</text>
  <text x="274" y="266" class="tag">bytes as they arrived</text>
  <line class="edge" x1="274" y1="200" x2="274" y2="224" marker-end="url(#arr)"/>

  <!-- ── the one writer ───────────────────────────────────────────────────── -->
  <rect class="agent" x="392" y="112" width="156" height="96" rx="10" filter="url(#glow)"/>
  <text x="470" y="140" class="title">librarian</text>
  <text x="470" y="158" class="tagA">the ONE writer</text>
  <text x="470" y="176" class="tagA">agent drafts,</text>
  <text x="470" y="192" class="tagA">8 gates decide</text>
  <line class="edge" x1="344" y1="160" x2="388" y2="160" marker-end="url(#arr)"/>

  <!-- ── the substrate ────────────────────────────────────────────────────── -->
  <rect class="truth" x="596" y="104" width="192" height="112" rx="12" filter="url(#glowT)"/>
  <text x="692" y="136" class="title">knowledge repo</text>
  <text x="692" y="156" class="tagT">git · markdown · yours</text>
  <text x="692" y="180" class="tagT">the only thing here</text>
  <text x="692" y="196" class="tagT">that is not rebuildable</text>
  <line class="edgeT" x1="548" y1="160" x2="592" y2="160" marker-end="url(#arrg)"/>
  <text x="570" y="150" class="elabT" text-anchor="middle">commit</text>

  <!-- ── serving ──────────────────────────────────────────────────────────── -->
  <rect class="store" x="836" y="86" width="200" height="58" rx="14"/>
  <text x="936" y="110" class="titleM" font-size="13">pages_index</text>
  <text x="936" y="128" class="tag">postgres + pgvector · derived</text>
  <line class="edgeT" x1="788" y1="140" x2="832" y2="115" marker-end="url(#arrg)"/>
  <text x="812" y="98" class="elabT" text-anchor="middle">rebuild</text>

  <!-- ONE process group, TWO surfaces, TWO tokens — `/admin` is an ASGI branch IN FRONT of the
       bearer middleware, so it never borrows MCP's auth, and it is inert until its hash is set. -->
  <rect x="820" y="162" width="232" height="190" rx="14" fill="none" stroke="#3d444d"
        stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="936" y="344" class="elab" text-anchor="middle">one process group, two tokens</text>

  <rect class="node" x="836" y="190" width="200" height="66" rx="10"/>
  <text x="936" y="214" class="title">MCP server</text>
  <text x="936" y="232" class="tag">the only API over the</text>
  <text x="936" y="247" class="tag">knowledge · acl.visible()</text>
  <line class="edge" x1="936" y1="144" x2="936" y2="186" marker-end="url(#arr)"/>

  <rect class="node" x="836" y="268" width="200" height="60" rx="10"/>
  <text x="936" y="291" class="title">/admin console</text>
  <text x="936" y="308" class="tag">operations, never pages</text>
  <text x="936" y="322" class="tag">inert until its hash is set</text>

  <rect class="human" x="836" y="372" width="200" height="48" rx="24"/>
  <text x="936" y="401" class="tagH" font-size="12">people · agents · Slack</text>
  <line class="edge" x1="906" y1="352" x2="906" y2="368" marker-end="url(#arr)"/>
  <line class="edge" x1="966" y1="352" x2="966" y2="368" marker-end="url(#arr)"/>

  <!-- the same people, both ends -->
  <path class="edge" d="M 90 270 L 90 456 L 936 456 L 936 424" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="513" y="448" class="elab" text-anchor="middle">the same people at both ends — they submit on the left and ask on the right</text>

  <!-- the sentence the picture is for -->
  <text x="692" y="240" class="elabT" text-anchor="middle">delete the rest — the knowledge remains</text>

  <!-- ── legend ───────────────────────────────────────────────────────────── -->
  <g transform="translate(26,494)">
    <rect x="0" y="-9" width="12" height="12" rx="3" fill="#1c1332" stroke="#8957e5" stroke-width="1.2"/>
    <text x="20" y="1" class="elab">a model — drafts, never decides</text>
    <rect x="250" y="-9" width="12" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="270" y="1" class="elab">code — decides</text>
    <rect x="410" y="-9" width="12" height="12" rx="6" fill="#201a02" stroke="#bb8009" stroke-width="1.2"/>
    <text x="430" y="1" class="elab">a human</text>
    <rect x="530" y="-9" width="12" height="12" rx="3" fill="#0c1f14" stroke="#3fb950" stroke-width="1.4"/>
    <text x="550" y="1" class="elab">git — the substrate</text>
    <rect x="700" y="-9" width="12" height="12" rx="6" fill="#0d1117" stroke="#484f58" stroke-dasharray="3 3" stroke-width="1.2"/>
    <text x="720" y="1" class="elab">derived, rebuildable</text>
  </g>
</svg>
