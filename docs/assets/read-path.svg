<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 496" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#8957e5" flood-opacity="0.55"/>
    </filter>
    <style>
      .node   { fill:#161b22; stroke:#30363d; stroke-width:1.2; }
      .gate   { fill:#11161d; stroke:#4d5563; stroke-width:1.5; }
      .agent  { fill:#1c1332; stroke:#8957e5; stroke-width:1.4; }
      .human  { fill:#201a02; stroke:#bb8009; stroke-width:1.3; }
      .store  { fill:#0d1117; stroke:#484f58; stroke-width:1.2; stroke-dasharray:5 4; }
      .title  { fill:#e6edf3; font-size:15px; font-weight:600; text-anchor:middle; }
      .tag    { fill:#8b949e; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagA   { fill:#c9b3f5; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tagH   { fill:#e3b341; font-size:10.5px; text-anchor:middle; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .edge   { stroke:#8b949e; stroke-width:1.5; fill:none; }
      .elab   { fill:#8b949e; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .sect   { fill:#6e7681; font-size:11px; font-weight:600; letter-spacing:2.5px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1058" height="494" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="26" y="46" class="sect">THE READ PATH</text>

  <!-- ── in ────────────────────────────────────────────────────────────────── -->
  <rect class="human" x="24" y="92" width="140" height="58" rx="10"/>
  <text x="94" y="118" class="title">a question</text>
  <text x="94" y="138" class="tagH">from a person</text>

  <!-- ── code decides who may see what, BEFORE anything is fetched ─────────── -->
  <rect class="gate" x="196" y="78" width="200" height="86" rx="10"/>
  <text x="296" y="106" class="title">acl.visible()</text>
  <text x="296" y="126" class="tag">the ONE place read</text>
  <text x="296" y="144" class="tag">access is decided</text>
  <line class="edge" x1="164" y1="121" x2="192" y2="121" marker-end="url(#arr)"/>
  <text x="296" y="186" class="elab" text-anchor="middle">a forbidden page and a page that does not exist</text>
  <text x="296" y="200" class="elab" text-anchor="middle">answer identically — which one it was is itself a leak</text>

  <!-- ── retrieval ─────────────────────────────────────────────────────────── -->
  <rect class="node" x="428" y="78" width="200" height="86" rx="10"/>
  <text x="528" y="106" class="title">hybrid retrieval</text>
  <text x="528" y="126" class="tag">full-text + vector,</text>
  <text x="528" y="144" class="tag">fused, contract-ranked</text>
  <line class="edge" x1="396" y1="121" x2="424" y2="121" marker-end="url(#arr)"/>

  <!-- ── the only box a model owns ─────────────────────────────────────────── -->
  <rect class="agent" x="660" y="78" width="200" height="86" rx="10" filter="url(#glow)"/>
  <text x="760" y="106" class="title">the answering agent</text>
  <text x="760" y="126" class="tagA">three read tools,</text>
  <text x="760" y="144" class="tagA">under YOUR identity</text>
  <line class="edge" x1="628" y1="121" x2="656" y2="121" marker-end="url(#arr)"/>

  <rect class="store" x="892" y="86" width="144" height="70" rx="14"/>
  <text x="964" y="116" class="tag" font-size="11.5">it may only ever</text>
  <text x="964" y="134" class="tag" font-size="11.5">see what the ACL</text>
  <text x="964" y="150" class="tag" font-size="11.5">already allowed</text>

  <!-- ── code decides again, on the way out ────────────────────────────────── -->
  <path class="edge" d="M 760 164 L 760 194 L 530 194 L 530 222" marker-end="url(#arr)"/>
  <text x="748" y="182" class="elab" text-anchor="end">a draft answer, with quotes</text>

  <rect class="gate" x="330" y="228" width="400" height="92" rx="12"/>
  <text x="530" y="258" class="title">the verifier</text>
  <text x="530" y="280" class="tag">can every figure and every quote be traced back to</text>
  <text x="530" y="298" class="tag">what the tools actually returned THIS run?</text>

  <!-- ── out ───────────────────────────────────────────────────────────────── -->
  <line class="edge" x1="430" y1="320" x2="430" y2="364" marker-end="url(#arr)"/>
  <text x="418" y="346" class="elab" text-anchor="end">yes</text>
  <rect class="node" x="200" y="368" width="230" height="70" rx="10"/>
  <text x="315" y="396" class="title" font-size="14">a cited answer</text>
  <text x="315" y="416" class="tag">quotes you can go and check</text>

  <line class="edge" x1="630" y1="320" x2="630" y2="364" marker-end="url(#arr)"/>
  <text x="642" y="346" class="elab">no</text>
  <rect class="node" x="630" y="368" width="230" height="70" rx="10"/>
  <text x="745" y="396" class="title" font-size="14">an honest refusal</text>
  <text x="745" y="416" class="tag">naming what was missing</text>

  <text x="530" y="462" class="elab" text-anchor="middle">a model gathers, code decides what ships — a system that never refuses is the failure, not the success</text>
</svg>
