# One image serves the HTTP app, serialized writer, and Slack Socket Mode adapter.
app = "stigmergy"
primary_region = "fra"

# In-flight writer work recovers through the queue lease if Fly reaches this timeout.
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]

[processes]
  # Byte-identical to the Dockerfile CMD.
  app = "stigmergy-server --transport http --host 0.0.0.0 --port 8080 --identities /app/identities.json --entity-registry /app/entity-registry.json"
  # Boot clones and verifies the knowledge repository before execing the writer loop.
  worker = "stigmergy-librarian-boot"
  slack = "stigmergy-slack --identities /app/identities.json --entity-registry /app/entity-registry.json --channels /app/slack-channels.json"

[env]
  # Credentials and DSNs are Fly secrets. This section contains non-secret defaults only.
  PORT = "8080"
  # Must match the deployed hostname for MCP Host-header validation.
  STIGMERGY_PUBLIC_HOST = "stigmergy.fly.dev"
  STIGMERGY_LIBRARIAN_REPO_URL = "https://github.com/sturlese/stigmergy-brain.git"
  STIGMERGY_LIBRARIAN_BACKEND = "pydantic"
  STIGMERGY_LIBRARIAN_MODEL = "anthropic:claude-sonnet-5"
  STIGMERGY_LIBRARIAN_TIMEOUT_S = "600"

[http_service]
  # The writer and Slack adapter expose no network service.
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/health"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  # Filing runs extraction, the model, Git gates, and full-tree lint passes.
  memory = "1gb"

[[vm]]
  processes = ["slack"]
  size = "shared-cpu-1x"
  memory = "512mb"
  # Socket Mode has no leader election; a Postgres advisory lock enforces one active process.
