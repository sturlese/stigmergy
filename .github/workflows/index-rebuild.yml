name: index-rebuild

# Nightly full rebuild of the derived Postgres index from this repository's own checkout.
#
# **A TEMPLATE — copy it into your knowledge repo and run it there, not here.** Actions logs on a
# PUBLIC repository are world-readable, and these operational runs narrate the corpus: page paths,
# entity ids, counts. Repository VARIABLES are not masked either (only secrets are), so the
# knowledge-repo slug and the digest channel id would be in the clear on every run. Running them
# from the knowledge repo — which is private, and is where the data already is — keeps the logs as
# private as the knowledge they describe. They ship here, disabled, so an adopter has the file.
#
# Two things fall out of running it there, both improvements:
#   * no cross-repo PAT. The knowledge repo is the workflow's OWN repository, so the job's read-only
#     `GITHUB_TOKEN` covers the checkout and `STIGMERGY_READONLY_PAT` stops existing.
#   * the CLI arrives by `pip` from the published platform, so no code is copied and nothing has
#     to be kept in sync. Pin `STIGMERGY_PLATFORM_REF` to a tag to control when it moves.
#
# The scheduling ceiling is unchanged: this is a CRON IN GITHUB ACTIONS, never a process group.
# `stigmergy-index` remains a full, independently runnable operator command; this only calls it.
on:
  schedule:
    - cron: "17 4 * * *"   # nightly, ~04:17 UTC — off the hour to dodge Actions' peak-minute queueing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: rebuild the derived index
    # Inert until an operator has actually configured the deployment. A fork — or this repo before
    # its secrets are set — skips cleanly rather than failing a scheduled run every night.
    if: vars.STIGMERGY_CRONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the knowledge repo (self — no token needed, and no PAT to leak)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: stigmergy-knowledge

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Third-party actions above are pinned by full commit SHA rather than a floating tag: a tag
      # can be moved by its maintainer, or by an attacker who compromises them, to point at
      # different code without this file changing. A SHA cannot. The platform itself is pinned by
      # `STIGMERGY_PLATFORM_REF` for the same reason — set it to a release tag, not a branch.
      - name: Install the stigmergy CLI from the published platform
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/${{ vars.STIGMERGY_PLATFORM_REPO || 'sturlese/stigmergy' }}.git@${{ vars.STIGMERGY_PLATFORM_REF || 'main' }}"

      - name: Rebuild the index
        run: stigmergy-index --rebuild --repo stigmergy-knowledge
        env:
          STIGMERGY_INDEX_DSN: ${{ secrets.INDEX_DSN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
