name: platform

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: lint, tests, and image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STIGMERGY_TEST_DSN: postgresql://stigmergy:stigmergy@localhost:54321/stigmergy_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
          checksum: "74947fe2c03315cf07e82ab3acc703eddef01aba4d5232a98e4c6825ec116131"
          enable-cache: false

      - name: Install system gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Install package
        run: uv sync --frozen --extra dev

      - name: Start test services
        run: docker compose up -d --wait

      - name: Lint
        run: .venv/bin/ruff check src tests evals scripts

      - name: Test
        run: .venv/bin/pytest --timeout=90 --timeout-method=thread -ra --cov-fail-under=75

      - name: Build deployment image
        run: docker build --tag stigmergy:test .

      - name: Scan repository
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Stop test services
        if: always()
        run: docker compose down -v
