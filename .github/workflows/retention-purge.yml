name: retention-purge

# Nightly (+ on-demand) retention over the capture queue in the staging Supabase Postgres:
# `stigmergy-queue purge` on the same schedule host as `index-rebuild.yml`, never a machine. The
# mechanism (`--older-than-days 0`) is the CLI's; what this file adds is a cron that actually
# calls it.
#
# **The scheduling ceiling, restated here**: this is a CRON IN GITHUB ACTIONS, never a
# process group — nothing in this system runs unattended outside Actions.
#
# The `if: ${{ !cancelled() }}` on the purge step stays: a future step added above must not
# silently take the purge down with it.
#
# **The assertion is the `job_runs` row, not the cron entry**: a scheduled job that silently stops
# is the failure mode being defended against, so "did retention run last night" has to be
# answerable from the database, not from trusting that this file is still correct —
#
#   SELECT job, status, finished_at, stats FROM job_runs
#   WHERE job IN ('capture-purge', 'capture-purge-dry-run')
#   ORDER BY started_at DESC LIMIT 10;
#
# A capture rejected for a SECRET or PII match does not wait for this job at all — its payload is
# purged IMMEDIATELY, from the same seam every other terminal outcome goes through
# (`librarian.worker._finish` -> `capture.retention.purge_secret_capture_immediately`). This
# workflow is the ORDINARY 30-day window over every other terminal capture row.
#
# Secret surface: `INDEX_DSN`, and nothing else — no model is called from this workflow.
# `ci.yml` (tests/lint) stays keyless by design and is untouched by this file.
#
# Third-party actions pinned by full commit SHA, not a floating tag (same posture as
# `index-rebuild.yml`) — a tag can be moved by the action's maintainer (or, if compromised, by an
# attacker) to point at different code without this file changing; a SHA cannot. The trailing
# `# vN` comment records which release that SHA was at resolution time.
on:
  schedule:
    - cron: "42 4 * * *"   # nightly, ~04:42 UTC — after index-rebuild's 04:17, off the hour too
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (list what would be purged; change nothing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  purge:
    name: purge the capture queue past its retention window
    # A fork inherits this file but not the secrets or the knowledge repo behind it.
    # Skip cleanly there instead of failing a scheduled run every night: the job runs
    # only where an operator has actually configured it.
    if: vars.STIGMERGY_KNOWLEDGE_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmergy (this repo — the stigmergy-queue CLI + deps)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install stigmergy
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # `if: ${{ !cancelled() }}`: the purge runs whether or not anything above it succeeded.
      # Retention is unconditional by nature, and a step added ahead of it later — with its own
      # failure modes — must not quietly regress it back to conditional. Only an actual workflow
      # CANCELLATION skips it.
      - name: Purge (writes a job_runs row whether or not anything was eligible)
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            stigmergy-queue purge --dry-run
          else
            stigmergy-queue purge
          fi
        env:
          STIGMERGY_INDEX_DSN: ${{ secrets.INDEX_DSN }}
