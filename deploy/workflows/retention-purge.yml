name: retention-purge

# Nightly `stigmergy-queue purge` against the capture queue, on the same schedule host as
# `index-rebuild.yml` — never a machine.
#
# **A TEMPLATE — copy it into your knowledge repo and run it there, not here.** See
# `index-rebuild.yml`'s header for the reasoning. This one reads no knowledge repo at all (the
# queue lives in Postgres) and so checks nothing out; it belongs beside the other two because its
# logs name what was purged, and because the three operational crons belong in one private place.
#
# The ceiling is unchanged by the move, and is restated here because moving a job is exactly
# when it gets quietly forgotten: this is a CRON IN GITHUB ACTIONS, never a process group —
# nothing in this system runs unattended outside Actions. `stigmergy-queue purge` remains a
# full, independently runnable operator command; this only calls it, on a schedule.
on:
  schedule:
    - cron: "42 4 * * *"   # nightly, ~04:42 UTC — after index-rebuild's 04:17, off the hour too
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (list what would be purged; change nothing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  purge:
    name: purge the capture queue past its retention window
    # Inert until an operator has actually configured the deployment.
    if: vars.STIGMERGY_CRONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the stigmergy CLI from the published platform
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/${{ vars.STIGMERGY_PLATFORM_REPO || 'sturlese/stigmergy' }}.git@${{ vars.STIGMERGY_PLATFORM_REF || 'main' }}"

      # `if: ${{ !cancelled() }}`: the purge runs whether or not anything above it succeeded.
      # Retention is unconditional by nature, and a step added ahead of it later — with its own
      # failure modes — must not quietly regress it back to conditional. Only an actual workflow
      # CANCELLATION skips it.
      #
      # The input reaches the shell through the environment rather than through `${{ }}`
      # interpolation into the script body: an expression pasted into a `run:` block is a shell
      # injection shape, and `workflow_dispatch` inputs are attacker-controlled the moment anyone
      # with write access is compromised. Quoting it as an env var costs nothing and closes it.
      - name: Purge (writes a job_runs row whether or not anything was eligible)
        if: ${{ !cancelled() }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STIGMERGY_INDEX_DSN: ${{ secrets.INDEX_DSN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            stigmergy-queue purge --dry-run
          else
            stigmergy-queue purge
          fi
