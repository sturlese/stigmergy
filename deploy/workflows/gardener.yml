name: gardener

# Daily (+ on-demand) corpus-health check over this repository and the derived index.
#
# **A TEMPLATE — copy it into your knowledge repo and run it there, not here.** See
# `index-rebuild.yml`'s header for the reasoning; this is the workflow that made the case.
# `stigmergy-gardener` prints its WHOLE report to stdout — entity ids, page paths and findings,
# straight out of the corpus — and on a public repository that log is readable by anyone, with no
# login.
#
# **The gardener is on a cron; the digest is not.** `stigmergy-digest` is a full, independently
# runnable operator command, deliberately left off a schedule — its own watermark is what makes
# that free: each post covers exactly the window since the previous one, so a run by hand tomorrow,
# or next month, still covers everything since the last one. Nothing is lost by not scheduling it,
# only timeliness.
#
# Placed after `index-rebuild` (04:17) and `retention-purge` (04:42) so the corpus view the
# gardener reads is the morning's, not last night's.
#
# Secret surface: `INDEX_DSN`/`OPENAI_API_KEY`, both shared with `index-rebuild.yml` — and nothing
# else. The gardener posts nowhere and holds no Slack credential; findings reach a person through
# `stigmergy-digest` and the admin console. `STIGMERGY_GARDENER_MODEL` is a repository VARIABLE,
# not a secret — a model name is not a credential. Variables are also not masked in logs, which is
# a second reason this workflow belongs in a private repository.
on:
  schedule:
    - cron: "7 5 * * *"   # daily, ~05:07 UTC — after index-rebuild's 17 4 and retention-purge's 42 4
  workflow_dispatch:

permissions:
  contents: read

# Concurrency: the realistic collision is cron + a manual `workflow_dispatch` (or a retry of one)
# landing close together. Overlap is genuinely bounded (append-only findings, per-run ids,
# forward-only watermarks; worst case is a duplicate run and doubled model spend), but closing the
# one realistic Actions-vs-Actions overlap is a single line.
# `cancel-in-progress: false`: a queued run WAITS rather than kills an in-flight one — cancelling a
# gardener run mid-write would discard real, already-computed work for no benefit. A concurrent
# LOCAL run is a DIFFERENT collision this group cannot see at all, and stays operator-owned.
concurrency:
  group: gardener
  cancel-in-progress: false

jobs:
  gardener:
    name: corpus-health findings
    # Inert until an operator has actually configured the deployment.
    if: vars.STIGMERGY_CRONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the knowledge repo (self — no token needed, and no PAT to leak)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: stigmergy-knowledge

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the stigmergy CLI from the published platform
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/${{ vars.STIGMERGY_PLATFORM_REPO || 'sturlese/stigmergy' }}.git@${{ vars.STIGMERGY_PLATFORM_REF || 'main' }}"

      # Findings + job_runs persisted and the severity-grouped report printed. A failed model pass
      # exits nonzero without withholding the deterministic findings, which are committed first.
      - name: stigmergy-gardener — the deterministic checks + the model editorial sweep
        run: stigmergy-gardener --repo stigmergy-knowledge
        env:
          STIGMERGY_INDEX_DSN: ${{ secrets.INDEX_DSN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STIGMERGY_GARDENER_MODEL: ${{ vars.STIGMERGY_GARDENER_MODEL }}
