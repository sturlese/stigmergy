name: repair-propose

# Daily (+ on-demand) pass that turns the gardener's findings into concrete repair PROPOSALS.
#
# **A TEMPLATE — copy it into your knowledge repo and run it there, not here.** Same reasoning as
# `gardener.yml`, one step further: `stigmergy-repair propose` reads the pages the findings name
# and prints what it proposed, so its log carries page paths and page names out of the corpus.
#
# **This job proposes and cannot apply.** `stigmergy-repair` has no `apply` command at all: a
# proposal is applied only through a door that decides who may authorize it — the review lane over
# MCP/Slack, or the admin console — and a steward approves them one at a time. That is why this
# workflow needs no write permission and no App credential: the only thing it produces is rows in
# `repair_proposals` waiting for a person.
#
# Placed an hour after `gardener` (05:07) so the findings it reads are this morning's rather than
# yesterday's. A run that finds no completed gardener run, or no proposable findings in it,
# proposes nothing and exits 0 — an ordinary state, not a failure.
#
# Secret surface: `INDEX_DSN`/`OPENAI_API_KEY`, both already shared with `index-rebuild.yml` and
# `gardener.yml`. `STIGMERGY_REPAIR_MODEL` is a repository VARIABLE, not a secret — a model name
# is not a credential. It is also not masked in logs, which is a second reason this workflow
# belongs in a private repository.
on:
  schedule:
    - cron: "7 6 * * *"   # daily, ~06:07 UTC — an hour after the gardener's 7 5, so findings exist
  workflow_dispatch:

permissions:
  contents: read

# Concurrency: the realistic collision is cron + a manual `workflow_dispatch` (or a retry of one)
# landing close together. Two overlapping passes would re-derive the same repairs from the same
# findings, and the pending-key unique index turns the loser into a duplicate-key error rather than
# a second question for the steward — bounded, but noise. `cancel-in-progress: false` for
# `gardener.yml`'s reason: a queued run WAITS rather than killing an in-flight one, because
# cancelling mid-pass discards model spend already made for no benefit.
concurrency:
  group: repair-propose
  cancel-in-progress: false

jobs:
  repair-propose:
    name: findings -> proposals a steward can approve
    # Inert until an operator has actually configured the deployment.
    if: vars.STIGMERGY_CRONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the knowledge repo (self — no token needed, and no PAT to leak)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: stigmergy-knowledge

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the stigmergy CLI from the published platform
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/${{ vars.STIGMERGY_PLATFORM_REPO || 'sturlese/stigmergy' }}.git@${{ vars.STIGMERGY_PLATFORM_REF || 'main' }}"

      # Reads the latest completed gardener run's findings, proposes against THIS checkout, and
      # persists one pending row per proposal plus a `job_runs` row for the pass. The proposer's
      # own operating procedure is read from `.claude/skills/repair-proposer/SKILL.md` in the
      # checkout above — a missing skill is a named refusal, and this step fails loudly rather than
      # proposing from the code-owned header alone.
      - name: stigmergy-repair propose — the findings that have a path to zero
        run: stigmergy-repair propose --repo stigmergy-knowledge
        env:
          STIGMERGY_INDEX_DSN: ${{ secrets.INDEX_DSN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STIGMERGY_REPAIR_MODEL: ${{ vars.STIGMERGY_REPAIR_MODEL }}
